<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; script-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>RLY/0 Hub</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div class="app">
      <nav class="rail" aria-label="主菜单">
        <img class="rail-ip" src="brand/rly0-ip-on-dark.svg" alt="RLY/0" />
        <button type="button" data-page="home" title="首页" aria-label="首页">
          <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z" /></svg>
        </button>
        <button type="button" data-page="agents" title="AI 助手" aria-label="AI 助手">
          <svg viewBox="0 0 24 24">
            <rect x="4" y="4" width="16" height="4" rx="2" />
            <rect x="4" y="10" width="13" height="4" rx="2" />
            <rect x="4" y="16" width="10" height="4" rx="2" />
          </svg>
        </button>
        <button type="button" data-page="relays" title="中转站" aria-label="中转站">
          <svg viewBox="0 0 24 24"><path d="M4 8h13l-3-3M20 16H7l3 3" /></svg>
        </button>
        <button type="button" data-page="accounts" title="Codex 账号" aria-label="Codex 账号">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 20c1.6-3.6 4.4-5.4 8-5.4s6.4 1.8 8 5.4" />
          </svg>
        </button>
        <button type="button" data-page="backup" title="备份" aria-label="备份">
          <svg viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 20h14" /></svg>
        </button>
        <button type="button" data-page="mcp" title="MCP 管理" aria-label="MCP 管理">
          <svg viewBox="0 0 24 24"><path d="M8 4H4v16h4M16 4h4v16h-4M9 12h6" /></svg>
        </button>
        <button type="button" data-page="skills" title="Skills 管理" aria-label="Skills 管理">
          <svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM8 9h8M8 13h5" /></svg>
        </button>
        <button type="button" data-page="threads" title="线程管理" aria-label="线程管理">
          <svg viewBox="0 0 24 24"><path d="M4 5h16v10H9l-5 4z" /></svg>
        </button>
        <button type="button" data-page="maintenance" title="维护工具" aria-label="维护工具">
          <svg viewBox="0 0 24 24"><path d="M4 20l7-7M10 4a6 6 0 0 0 8 8l3-3-5-1-1-5z" /></svg>
        </button>
        <button type="button" data-page="updates" title="更新" aria-label="更新">
          <svg viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5M4 20h16" /></svg>
        </button>
        <span class="rail-gap"></span>
        <button type="button" data-page="support" title="支持" aria-label="支持">
          <svg viewBox="0 0 24 24">
            <path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" />
          </svg>
        </button>
        <button type="button" data-page="settings" title="设置" aria-label="设置">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3" />
            <path
              d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"
            />
          </svg>
        </button>
      </nav>
      <div class="stage">
        <header class="top">
          <img class="lockup" src="brand/rly0-lockup-on-dark.svg" alt="RLY/0 零号中转" />
          <h1 id="title"></h1>
          <button type="button" class="ad star" id="star" title="在 GitHub 上给 RLY/0 Hub 点 Star">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M12 .297C5.37.297 0 5.67 0 12.297c0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.043-1.61-4.043-1.61-.546-1.387-1.333-1.756-1.333-1.756-1.09-.745.083-.729.083-.729 1.205.084 1.838 1.237 1.838 1.237 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.467-1.334-5.467-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23a11.5 11.5 0 0 1 3-.405c1.02.005 2.045.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"
              />
            </svg>
            Star 支持
          </button>
          <button
            type="button"
            class="ad"
            id="ad"
            title="作者自营的中转站，在浏览器中打开 rly0.com"
          >
            <b></b>作者自营 · RLY/0 零号中转
          </button>
        </header>
        <main id="page" tabindex="-1"></main>
      </div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="pages/resources.js"></script>
    <script src="pages/system.js"></script>
    <script src="pages/mock.js"></script>
    <script src="app.js"></script>
  </body>
</html>
