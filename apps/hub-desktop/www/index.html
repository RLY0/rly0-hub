<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; script-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>RLY/0 Hub</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div class="app">
      <nav class="rail" aria-label="主菜单">
        <img class="rail-ip" src="brand/rly0-ip-on-dark.svg" alt="RLY/0 Hub" />
        <button type="button" data-page="home" aria-label="首页">
          <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z" /></svg>
          <span>首页</span>
        </button>
        <button type="button" data-page="accounts" aria-label="账号">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 20c1.6-3.6 4.4-5.4 8-5.4s6.4 1.8 8 5.4" />
          </svg>
          <span>账号</span>
        </button>
        <button type="button" data-page="relays" aria-label="中转站">
          <svg viewBox="0 0 24 24"><path d="M4 8h13l-3-3M20 16H7l3 3" /></svg>
          <span>中转站</span>
        </button>
        <button type="button" data-page="agents" aria-label="AI 助手">
          <svg viewBox="0 0 24 24">
            <rect x="4" y="4" width="16" height="4" rx="2" />
            <rect x="4" y="10" width="13" height="4" rx="2" />
            <rect x="4" y="16" width="10" height="4" rx="2" />
          </svg>
          <span>AI 助手</span>
        </button>
        <button type="button" data-page="maintenance" aria-label="维护工具">
          <svg viewBox="0 0 24 24">
            <path
              d="M14.5 5.5a4 4 0 0 0-4.9 5.2L4 16.3V20h3.7l5.6-5.6a4 4 0 0 0 5.2-4.9l-2.6 2.6-2.8-.4-.4-2.8z"
            />
          </svg>
          <span>维护</span>
        </button>
        <span class="rail-gap"></span>
        <button type="button" data-page="support" class="rail-support" aria-label="支持">
          <svg viewBox="0 0 24 24">
            <path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" />
          </svg>
          <span>支持</span>
        </button>
        <button type="button" data-page="settings" aria-label="设置">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3" />
            <path
              d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"
            />
          </svg>
          <span>设置</span>
        </button>
      </nav>
      <div class="stage">
        <header class="top">
          <h1 id="title"></h1>
          <button type="button" class="codex-fab" id="codexFab" title="打开 Codex">
            <span class="pulse off" id="codexFabDot"></span>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="4" width="18" height="16" rx="3" />
              <path d="M7 9l3 3-3 3M12 15h5" />
            </svg>
            <span id="codexFabText">打开 Codex</span>
          </button>
          <button type="button" class="ad star" id="star" title="在 GitHub 上给 RLY/0 Hub 点 Star">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M12 .297C5.37.297 0 5.67 0 12.297c0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.043-1.61-4.043-1.61-.546-1.387-1.333-1.756-1.333-1.756-1.09-.745.083-.729.083-.729 1.205.084 1.838 1.237 1.838 1.237 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.467-1.334-5.467-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23a11.5 11.5 0 0 1 3-.405c1.02.005 2.045.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"
              />
            </svg>
            Star 支持
          </button>
          <button
            type="button"
            class="ad"
            id="ad"
            title="作者自营的中转站，在浏览器中打开 rly0.com"
          >
            <b></b>作者自营 · RLY/0 零号中转
          </button>
        </header>
        <main id="page" tabindex="-1"></main>
      </div>
    </div>
    <div class="boot show" id="boot" role="status" aria-label="正在加载">
      <div class="boot-stage">
        <img class="boot-ip" src="brand/rly0-ip-on-dark.svg" alt="" />
        <span class="boot-shadow"></span>
      </div>
      <div class="boot-bars" aria-hidden="true"><i></i><i></i><i></i></div>
      <span class="boot-text">正在加载</span>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="pages/ui.js"></script>
    <script src="pages/resources.js"></script>
    <script src="pages/system.js"></script>
    <script src="pages/agents.js"></script>
    <script src="pages/provider-marks.js"></script>
    <script src="pages/reset-credits.js"></script>
    <script src="pages/account-cards.js"></script>
    <script src="pages/claude-isolation.js"></script>
    <script src="pages/add-login-dialog.js"></script>
    <script src="pages/grok-gemini-accounts.js"></script>
    <script src="pages/agent-accounts.js"></script>
    <script src="pages/relays.js"></script>
    <script src="pages/instructions.js"></script>
    <script src="pages/home.js"></script>
    <script src="pages/discovery.js"></script>
    <script src="pages/mock.js"></script>
    <script src="app.js"></script>
  </body>
</html>
